<!doctype html>
<html lang="pt-br">

<head>

  <title>

  </title>

  <link

    rel="stylesheet"
  >

  <link rel="stylesheet" href="../../css/base.css">

<body class="cover-page">

  <main class="cover-book" role="main">

    <section

    >

      <!-- Logos institucionais -->
      <div class="cover-top-right">

        <img
          src="../../assets/capa/famema.png"
          alt="Faculdade de Medicina de Marília"
          class="cover-logo cover-logo--famema"
        >

      

      </div>

      <!-- Ilustração lateral -->
      <div class="cover-left">

        <img
          src="../../assets/capa/membrana.png"

      </div>

      <!-- Título e autoria -->
      <div class="cover-right">

        <div class="cover-content">

          <div class="cover-title-block">

            <h1
              id="coverTitle"

            <div

            <p class="cover-subtitle">

          </div>

          <div
            class="cover-authors"

            <p class="cover-authors__label">

            </p>

            <p class="cover-author cover-author--primary">
              Juliana de Arruda Meyer Coracini
            </p>

            <p class="cover-author">

            </p>

            <p class="cover-author">
              João Baptista Cardia Neto
            </p>

            <p class="cover-author">
              Osni Lázaro Pinheiro
            </p>

          </div>

        </div>

      </div>

      <!-- Local e ano -->
      <div class="cover-publication">

        <span>Marília – SP</span>
        <span>2026</span>

      </div>

      <!-- Navegação -->
      <a
  class="btn primary cover-next"
  href="./folha-rosto.html"
      >
        Próxima →
      </a>

  </main>

  <script src="../../js/app.js"></script>
